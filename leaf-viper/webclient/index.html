<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Leaf Viper — Sign In</title>
  <link rel="stylesheet" href="style.css?v=20260330" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260330-icons-1" />
  <link rel="manifest" href="manifest.json?v=20260330-icons-1" />
  <script>(function(){var s=localStorage.getItem('ob_theme'),d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(s==='dark'||(s===null&&d))document.documentElement.setAttribute('data-theme','dark');else if(s==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
</head>
<body class="login-body">

  <button id="btn-theme" class="btn-theme" title="Toggle dark mode" style="position:fixed;top:16px;right:16px;font-size:20px;z-index:999;">🌙</button>

  <!-- ── Server setup screen ─────────────────────────────────────────────── -->
  <div id="setup-card" class="login-card hidden">
    <div class="login-logo">
      <img src="favicon.svg?v=20260330-icons-1" width="64" height="64" style="border-radius:14px" alt="Leaf Viper" />
    </div>
    <h1 class="login-title">Leaf Viper</h1>
    <p class="login-sub">Enter your server address</p>
    <div class="field">
      <label for="server-url">Server URL</label>
      <input id="server-url" type="url" placeholder="https://myserver.com" />
    </div>
    <p id="setup-error" class="error-msg hidden"></p>
    <button id="setup-btn" class="btn btn-primary btn-full">Connect</button>
  </div>

  <!-- ── Login screen ────────────────────────────────────────────────────── -->
  <div id="login-card" class="login-card hidden">
    <div class="login-logo">
      <img src="favicon.svg" width="64" height="64" style="border-radius:14px" alt="Leaf Viper" />
    </div>
    <h1 class="login-title">Leaf Viper</h1>
    <p id="login-server-label" class="login-sub" style="font-size:.78rem;color:#9ca3af"></p>
    <p class="login-sub">Sign in to your account</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username"
               placeholder="admin" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               placeholder="••••••" required />
      </div>
      <p id="login-error" class="error-msg hidden"></p>
      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        Sign In
      </button>
    </form>
    <p style="margin-top:10px;font-size:.82rem;color:#94a3b8;text-align:center">
      Don't have an account?
      <a id="register-link" href="/" style="color:#60a5fa;text-decoration:none">Register here</a>
    </p>
    <button id="change-server-btn" class="btn btn-ghost btn-full" style="margin-top:8px;font-size:.8rem">
      ⚙ Change server
    </button>
    <a id="btn-switch-app" href="#" class="btn btn-ghost btn-full" style="margin-top:8px;font-size:.8rem">
      <img src="/crossed-viper/icon-256.png" alt="" style="width:14px;height:14px;border-radius:3px;pointer-events:none">
      Go to Crossed Viper
    </a>
  </div>

  <script>
    const SHOW_CHANGE_SERVER = window._SHOW_CHANGE_SERVER !== false;
    localStorage.setItem('ot_show_change_server', SHOW_CHANGE_SERVER ? '1' : '0');
    localStorage.setItem('ob_show_change_server', SHOW_CHANGE_SERVER ? '1' : '0');
    const serverUrl = () => (localStorage.getItem('ob_server') || '').replace(/\/$/, '');

    function showSetup(prefill) {
      document.getElementById('login-card').classList.add('hidden');
      const card = document.getElementById('setup-card');
      card.classList.remove('hidden');
      const inp = document.getElementById('server-url');
      inp.value = prefill || (isCapacitor ? '' : window.location.origin);
      inp.focus();
    }

    function showLogin() {
      document.getElementById('setup-card').classList.add('hidden');
      const card = document.getElementById('login-card');
      card.classList.remove('hidden');
      document.getElementById('login-server-label').textContent = serverUrl();
      document.getElementById('username').focus();
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    // On Capacitor/Android, window.location.origin is "https://localhost" — NOT the server
    const isCapacitor = typeof window.Capacitor !== 'undefined' ||
                        window.location.origin === 'https://localhost' ||
                        window.location.origin === 'capacitor://localhost';

    // Clear stale value saved by old builds on Capacitor
    if (isCapacitor && localStorage.getItem('ob_server') === window.location.origin) {
      localStorage.removeItem('ob_server');
    }

    if (localStorage.getItem('ob_token')) {
      window.location.href = isCapacitor ? 'app.html' : '/leaf-viper/app.html';
    } else if (!serverUrl()) {
      if (isCapacitor) {
        showSetup();
      } else {
        // Web browser — same-server deployment, use current origin
        localStorage.setItem('ob_server', window.location.origin);
        showLogin();
      }
    } else {
      showLogin();
    }

    // ── Setup form ────────────────────────────────────────────────────────────
    document.getElementById('setup-btn').addEventListener('click', async () => {
      const errEl = document.getElementById('setup-error');
      const btn   = document.getElementById('setup-btn');
      errEl.classList.add('hidden');
      let url = document.getElementById('server-url').value.trim().replace(/\/$/, '');
      if (!url) { errEl.textContent = 'Please enter a server URL.'; errEl.classList.remove('hidden'); return; }
      btn.disabled = true;
      btn.textContent = 'Connecting...';
      try {
        const res = await fetch(`${url}/auth/login`, { method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'username=_probe_&password=_probe_' });
        if (res.status === 422 || res.status === 401 || res.status === 200) {
          localStorage.setItem('ob_server', url);
          showLogin();
        } else {
          throw new Error(`Unexpected status: ${res.status}`);
        }
      } catch (e) {
        errEl.textContent = e.message.includes('fetch') ? 'Cannot connect to server.' : e.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    });

    // ── Login form ────────────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      const btn   = document.getElementById('login-btn');
      errEl.classList.add('hidden');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) {
        errEl.textContent = 'Please enter your username and password.';
        errEl.classList.remove('hidden');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        const res = await fetch(`${serverUrl()}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ username, password }),
        });
        if (!res.ok) {
          const j = await res.json().catch(() => ({}));
          throw new Error(j.detail || `Error ${res.status}`);
        }
        const { access_token } = await res.json();
        localStorage.setItem('ob_token', access_token);
        window.location.href = isCapacitor ? 'app.html' : '/leaf-viper/app.html';
      } catch (e) {
        errEl.textContent = e.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    document.getElementById('change-server-btn').addEventListener('click', () => showSetup(serverUrl()));

    if (!SHOW_CHANGE_SERVER) {
      document.getElementById('change-server-btn').style.display = 'none';
    }

    (function () {
      const switchBtn = document.getElementById('btn-switch-app');
      const tasksUrl = serverUrl() ? serverUrl().replace(/\/$/, '') + '/crossed-viper/' : '/crossed-viper/';
      const crossedViperPackage = 'com.crossedviper.app';
      switchBtn.href = tasksUrl;
      switchBtn.addEventListener('click', async function (event) {
        const launcher = globalThis.Capacitor?.Plugins?.AppLauncher;
        if (isCapacitor && launcher && typeof launcher.canOpenUrl === 'function' && typeof launcher.openUrl === 'function') {
          event.preventDefault();
          try {
            const canOpen = await launcher.canOpenUrl({ url: crossedViperPackage });
            if (canOpen?.value) {
              await launcher.openUrl({ url: crossedViperPackage });
              return;
            }
          } catch {}
        }

        const desktopApi = globalThis.pywebview?.api;
        if (!desktopApi || typeof desktopApi.switch_app !== 'function') return;
        event.preventDefault();
        try {
          const opened = await desktopApi.switch_app('crossed-viper');
          if (!opened) globalThis.location.href = tasksUrl;
        } catch {
          globalThis.location.href = tasksUrl;
        }
      });
      const registerLink = document.getElementById('register-link');
      registerLink.href = serverUrl() ? serverUrl().replace(/\/$/, '') + '/' : '/';
    })();

    // ── Theme toggle ──────────────────────────────────────────────────────────
    (function() {
      const btn = document.getElementById('btn-theme');
      function updateBtn() {
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      }
      btn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('ob_theme', next);
        updateBtn();
      });
      updateBtn();
    })();
  </script>
</body>
</html>
