services:
  db:
    image: postgres:16-alpine
    container_name: viper_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vipersuite
      POSTGRES_USER: vipersuite
      POSTGRES_PASSWORD: vipersuite
    volumes:
      - viper_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vipersuite"]
      interval: 5s
      timeout: 5s
      retries: 10

  viper_suite:
    build: .
    container_name: viper_suite
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Change this secret in production!
      SECRET_KEY: change-me-in-production-use-a-long-random-string
      DATABASE_URL: postgresql://vipersuite:vipersuite@db:5432/vipersuite
      ACCESS_TOKEN_EXPIRE_MINUTES: 43200
      # Set this to your server address so the web client skips the server setup screen.
      # Example: CROSSED_VIPER_SERVER: https://crossedviper.example.com
      CROSSED_VIPER_SERVER: ""

volumes:
  viper_db:
