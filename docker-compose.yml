services:
  db:
    image: postgres:16-alpine
    container_name: opentask_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: opentask
      POSTGRES_USER: opentask
      POSTGRES_PASSWORD: opentask
    volumes:
      - opentask_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opentask"]
      interval: 5s
      timeout: 5s
      retries: 10

  opentask:
    build: .
    container_name: opentask
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Change this secret in production!
      SECRET_KEY: change-me-in-production-use-a-long-random-string
      DATABASE_URL: postgresql://opentask:opentask@db:5432/opentask

volumes:
  opentask_db:
