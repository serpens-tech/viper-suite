<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenTask Suite</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #f1f5f9;
      --card-bg:  #ffffff;
      --border:   #e2e8f0;
      --text:     #0f172a;
      --sub:      #64748b;
      --shadow:   0 4px 24px rgba(0,0,0,.08);
      --shadow-h: 0 8px 36px rgba(0,0,0,.14);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #0f172a;
        --card-bg:  #1e293b;
        --border:   #334155;
        --text:     #f1f5f9;
        --sub:      #94a3b8;
        --shadow:   0 4px 24px rgba(0,0,0,.4);
        --shadow-h: 0 8px 36px rgba(0,0,0,.6);
      }
    }

    body {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 2rem 1rem;
      gap: 2.5rem;
    }

    .headline {
      text-align: center;
    }
    .headline h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .headline p {
      margin-top: .4rem;
      color: var(--sub);
      font-size: .95rem;
    }

    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      padding: 2rem 2.5rem;
      width: 220px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-h);
    }
    .card:active {
      transform: translateY(-1px);
    }

    .card svg {
      width: 72px;
      height: 72px;
      border-radius: 18px;
    }

    .card-name {
      font-size: 1.15rem;
      font-weight: 700;
    }
    .card-desc {
      font-size: .82rem;
      color: var(--sub);
      text-align: center;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="headline">
    <h1>Welcome</h1>
    <p>Choose an application to open</p>
  </div>

  <div class="cards">
    <a class="card" href="/tasks/">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="#7c3aed"/>
        <path d="M10 18l6 6 10-12" stroke="white" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="card-name">OpenTask</span>
      <span class="card-desc">Manage your tasks and to-do lists</span>
    </a>

    <a class="card" href="/budget/">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="10" fill="#16a34a"/>
        <path d="M18 7v2.3M18 24.7V27" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M22.5 11.5c-1-1.5-5.5-2-6.5 0s1 3.5 4 4 6 2.5 5 5-4.5 3-7 1.5"
              stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <span class="card-name">OpenBudget</span>
      <span class="card-desc">Track your income and expenses</span>
    </a>
  </div>
</body>
</html>
