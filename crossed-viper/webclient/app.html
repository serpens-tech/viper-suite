<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crossed Viper</title>
  <link rel="stylesheet" href="style.css?v=20260330-2" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260330-icons-1" />
  <link rel="manifest" href="manifest.json?v=20260330-icons-1" />
  <script>(function(){var s=localStorage.getItem('ot_theme'),d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(s==='dark'||(s===null&&d))document.documentElement.setAttribute('data-theme','dark');else if(s==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
</head>
<body class="app-body">

  <!-- ── Top bar ─────────────────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="btn-hamburger" class="btn-hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <img src="favicon.svg?v=20260330-icons-1" width="26" height="26" style="border-radius:7px;display:block" alt="Crossed Viper" />
      <span class="topbar-brand">Crossed Viper</span>
    </div>
    <div class="topbar-right">
      <span id="topbar-user" class="topbar-username"></span>
      <button id="btn-theme" type="button" class="btn-theme" title="Toggle dark mode">🌙</button>
      <button id="btn-switch-app" type="button" class="icon-only-btn" title="Go to Leaf Viper" aria-label="Go to Leaf Viper"><img src="/leaf-viper/icon-256.png?v=20260330-icons-1" style="pointer-events:none" alt=""></button>
      <button id="btn-admin" type="button" class="btn btn-ghost btn-sm hidden">Admin Panel</button>
      <button id="btn-account" type="button" class="icon-only-btn" title="My account" aria-label="My account">👤</button>
      <button id="btn-server" type="button" class="btn btn-ghost btn-sm" title="Change server">⚙</button>
      <button id="btn-logout" type="button" class="icon-only-btn" title="Logout" aria-label="Logout">🚪</button>
    </div>
  </header>

  <!-- ── Main layout ─────────────────────────────────────────────────────── -->
  <div class="layout">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <!-- Sidebar: lists -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">MY LISTS</span>
        <button id="btn-new-list" type="button" class="btn btn-icon" title="New list">＋</button>
      </div>
      <ul id="lists-ul" class="lists-ul"></ul>

      <!-- sidebar footer: shown on mobile only -->
      <div class="sidebar-footer">
        <div class="sidebar-footer-user">
          <span id="sidebar-username" class="sidebar-footer-name"></span>
        </div>
        <button id="btn-admin-sidebar" type="button" class="btn btn-ghost btn-sm btn-full hidden">&#9733; Admin Panel</button>
        <button id="btn-theme-sidebar" type="button" class="btn btn-ghost btn-sm btn-full">🌙 Dark mode</button>
        <button id="btn-account-sidebar" type="button" class="icon-only-btn" title="My account" aria-label="My account">👤</button>
        <button id="btn-switch-app-sidebar" type="button" class="icon-only-btn" title="Go to Leaf Viper" aria-label="Go to Leaf Viper"><img src="/leaf-viper/icon-256.png?v=20260330-icons-1" style="pointer-events:none" alt=""></button>
        <button id="btn-server-sidebar" type="button" class="btn btn-ghost btn-sm btn-full">&#9881; Change Server</button>
        <button id="btn-logout-sidebar" type="button" class="icon-only-btn" title="Logout" aria-label="Logout">🚪</button>
      </div>
    </aside>

    <!-- Main panel: tasks -->
    <main class="main-panel">
      <div class="panel-header">
        <h2 id="tasks-heading" class="tasks-heading">← Select a list</h2>
        <div id="task-actions" class="task-actions hidden">
          <button id="btn-new-task" type="button" class="btn btn-primary btn-sm">+ New Task</button>
          <button id="btn-edit-list" type="button" class="icon-only-btn" title="Edit list" aria-label="Edit list">✏️</button>
          <button id="btn-delete-list" type="button" class="icon-only-btn" title="Delete list" aria-label="Delete list">🗑️</button>
        </div>
      </div>

      <ul id="tasks-ul" class="tasks-ul"></ul>

      <p id="tasks-empty" class="tasks-empty hidden">No tasks yet. Create one!</p>
    </main>
  </div>

  <!-- ── Modals ──────────────────────────────────────────────────────────── -->

  <!-- Generic text form modal -->
  <div id="modal-form" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="modal-title" class="modal-heading"></h3>
      <div id="modal-fields"></div>
      <p id="modal-error" class="error-msg hidden"></p>
      <div class="modal-footer">
        <button id="modal-cancel" type="button" class="btn btn-ghost">Cancel</button>
        <button id="modal-save" type="button" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Admin panel modal -->
  <div id="modal-admin" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card modal-wide">
      <div class="modal-head-row">
        <h3 class="modal-heading">Admin Panel — Users</h3>
        <button id="admin-close" type="button" class="btn-close" aria-label="Close">✕</button>
      </div>
      <div class="admin-toolbar">
        <button id="btn-new-user" type="button" class="btn btn-primary btn-sm">+ New User</button>
        <button id="btn-edit-user" type="button" class="icon-only-btn" title="Edit user" aria-label="Edit user">✏️</button>
        <button id="btn-delete-user" type="button" class="icon-only-btn" title="Delete user" aria-label="Delete user">🗑️</button>
      </div>
      <table class="users-table">
        <thead>
          <tr>
            <th>ID</th><th>Username</th><th>Role</th><th>Created</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <p id="admin-error" class="error-msg hidden"></p>
    </div>
  </div>

  <!-- User form modal (create / edit user) -->
  <div id="modal-user-form" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 id="user-form-title" class="modal-heading"></h3>
      <div class="field">
        <label for="uf-username">Username *</label>
        <input id="uf-username" type="text" />
      </div>
      <div class="field">
        <label for="uf-password" id="uf-pwd-label">Password *</label>
        <input id="uf-password" type="password" />
      </div>
      <div class="field field-check">
        <input id="uf-is-admin" type="checkbox" />
        <label for="uf-is-admin">Admin privileges</label>
      </div>
      <p id="user-form-error" class="error-msg hidden"></p>
      <div class="modal-footer">
        <button id="user-form-cancel" type="button" class="btn btn-ghost">Cancel</button>
        <button id="user-form-save" type="button" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" class="toast hidden"></div>

  <!-- My Account modal -->
  <div id="modal-account" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-head-row">
        <h3 class="modal-heading">My Account</h3>
        <button id="account-close" type="button" class="btn-close" aria-label="Close">✕</button>
      </div>
      <div class="field">
        <label for="acc-username">Username *</label>
        <input id="acc-username" type="text" />
      </div>
      <div class="field">
        <label for="acc-password">New Password <span style="font-weight:400;color:#9ca3af">(blank = keep current)</span></label>
        <input id="acc-password" type="password" />
      </div>
      <div class="field">
        <label for="acc-pin">Local PIN <span style="font-weight:400;color:#9ca3af">(4-8 digits, local mode only)</span></label>
        <input id="acc-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Leave blank to keep" />
      </div>
      <div class="field" style="display:flex;gap:8px;flex-wrap:wrap">
        <button id="btn-export-local" type="button" class="btn btn-ghost">Export Local Backup</button>
        <button id="btn-import-local" type="button" class="btn btn-ghost">Import Local Backup</button>
        <input id="import-local-file" type="file" accept="application/json" class="hidden" />
      </div>
      <p id="account-error" class="error-msg hidden"></p>
      <div class="modal-footer" style="justify-content:space-between">
        <button id="btn-delete-account" type="button" class="icon-only-btn" title="Delete account" aria-label="Delete account">🗑️</button>
        <div style="display:flex;gap:8px">
          <button id="account-cancel" type="button" class="btn btn-ghost">Cancel</button>
          <button id="account-save" type="button" class="btn btn-primary">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js?v=20260330-2"></script>
</body>
</html>
