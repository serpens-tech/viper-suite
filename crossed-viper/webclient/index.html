<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Crossed Viper — Sign In</title>
  <link rel="stylesheet" href="style.css?v=20260330-2" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=20260330-icons-1" />
  <link rel="manifest" href="manifest.json?v=20260330-icons-1" />
  <script>(function(){var s=localStorage.getItem('ot_theme'),d=window.matchMedia('(prefers-color-scheme:dark)').matches;if(s==='dark'||(s===null&&d))document.documentElement.setAttribute('data-theme','dark');else if(s==='light')document.documentElement.setAttribute('data-theme','light');})()</script>
</head>
<body class="login-body">

  <button id="btn-theme" class="btn-theme" title="Toggle dark mode" style="position:fixed;top:16px;right:16px;font-size:20px;z-index:999;">🌙</button>

  <!-- ── Server setup screen ─────────────────────────────────────────────── -->
  <div id="setup-card" class="login-card hidden">
    <div class="login-logo">
      <img src="favicon.svg?v=20260330-icons-1" width="64" height="64" style="border-radius:14px" alt="Crossed Viper" />
    </div>
    <h1 class="login-title">Crossed Viper</h1>
    <p class="login-sub">Enter your server address</p>
    <div class="field">
      <label for="server-url">Server URL</label>
      <input id="server-url" type="url" placeholder="https://opentask.example.com" />
    </div>
    <p id="setup-error" class="error-msg hidden"></p>
    <button id="setup-btn" class="btn btn-primary btn-full">Connect</button>
    <button id="local-account-btn" class="btn btn-ghost btn-full" style="margin-top:8px;font-size:.85rem">
      Use local account (no server)
    </button>
  </div>

  <!-- ── Login screen ────────────────────────────────────────────────────── -->
  <div id="login-card" class="login-card hidden">
    <div class="login-logo">
      <img src="favicon.svg" width="64" height="64" style="border-radius:14px" alt="Crossed Viper" />
    </div>
    <h1 class="login-title">Crossed Viper</h1>
    <p id="login-server-label" class="login-sub" style="font-size:.78rem;color:#9ca3af"></p>
    <p class="login-sub">Sign in to your account</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username"
               placeholder="admin" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password"
               placeholder="••••••" required />
      </div>
      <div id="local-pin-wrap" class="field hidden">
        <label for="local-pin">PIN</label>
        <input id="local-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter your local PIN" />
      </div>

      <p id="login-error" class="error-msg hidden"></p>

      <button type="submit" class="btn btn-primary btn-full" id="login-btn">
        Sign In
      </button>
    </form>
    <p id="register-hint" style="margin-top:10px;font-size:.82rem;color:#94a3b8;text-align:center">
      Don't have an account?
      <a id="register-link" href="/" style="color:#60a5fa;text-decoration:none">Register here</a>
    </p>
    <button id="change-server-btn" class="btn btn-ghost btn-full" style="margin-top:8px;font-size:.8rem">
      ⚙ Change server
    </button>
    <a id="btn-switch-app" href="#" class="btn btn-ghost btn-full" style="margin-top:8px;font-size:.8rem">
      <img src="/leaf-viper/icon-256.png" alt="" style="width:14px;height:14px;border-radius:3px;pointer-events:none">
      Go to Leaf Viper
    </a>
  </div>

  <!-- ── Local PIN unlock screen ─────────────────────────────────────────── -->
  <div id="unlock-card" class="login-card hidden">
    <div class="login-logo">
      <img src="favicon.svg?v=20260330-icons-1" width="64" height="64" style="border-radius:14px" alt="Crossed Viper" />
    </div>
    <h1 class="login-title">Crossed Viper</h1>
    <p id="unlock-user-label" class="login-sub">Local account is locked</p>
    <div class="field">
      <label for="unlock-pin">PIN</label>
      <input id="unlock-pin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter PIN" />
    </div>
    <p id="unlock-error" class="error-msg hidden"></p>
    <button id="unlock-btn" class="btn btn-primary btn-full">Unlock</button>
    <button id="unlock-switch-btn" class="btn btn-ghost btn-full" style="margin-top:8px;font-size:.8rem">Use another account</button>
  </div>

  <script>
    const _CAP      = typeof window.Capacitor !== 'undefined' ||
                      window.location.origin === 'https://localhost' ||
                      window.location.origin === 'capacitor://localhost';
    const IS_DESKTOP     = window.location.hostname === '127.0.0.1';
    const IS_LOCAL_CLIENT = IS_DESKTOP || _CAP;
    const PATH_APP  = IS_LOCAL_CLIENT ? 'app.html' : '/crossed-viper/app.html';
    const SHOW_CHANGE_SERVER = window._SHOW_CHANGE_SERVER !== false;
    localStorage.setItem('ot_show_change_server', SHOW_CHANGE_SERVER ? '1' : '0');
    localStorage.setItem('ob_show_change_server', SHOW_CHANGE_SERVER ? '1' : '0');
    const serverUrl = () => (localStorage.getItem('ot_server') || '').replace(/\/$/, '');    
    const authMode = () => localStorage.getItem('ot_auth_mode') || 'remote';
    let unlockUser = null;

    function parseJson(key, fallback) {
      try {
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
      } catch {
        return fallback;
      }
    }

    function hideAllCards() {
      document.getElementById('setup-card').classList.add('hidden');
      document.getElementById('login-card').classList.add('hidden');
      document.getElementById('unlock-card').classList.add('hidden');
    }

    function setAuthMode(mode) {
      localStorage.setItem('ot_auth_mode', mode);
    }

    function showSetup(prefill) {
      hideAllCards();
      const card = document.getElementById('setup-card');
      card.classList.remove('hidden');
      if (prefill) document.getElementById('server-url').value = prefill;
      document.getElementById('server-url').focus();
    }

    function showLogin() {
      hideAllCards();
      const card = document.getElementById('login-card');
      card.classList.remove('hidden');
      const localMode = authMode() === 'local';
      document.getElementById('login-server-label').textContent = localMode
        ? 'Local account mode (this device only)'
        : serverUrl();
      const registerHint = document.getElementById('register-hint');
      if (localMode) {
        registerHint.innerHTML = 'Your local account will be created automatically on first sign in.';
      } else {
        registerHint.innerHTML = 'Don\'t have an account? <a id="register-link" href="/" style="color:#60a5fa;text-decoration:none">Register here</a>';
        const newRegisterLink = document.getElementById('register-link');
        newRegisterLink.href = serverUrl() ? serverUrl().replace(/\/$/, '') + '/' : '/';
      }
      const pinWrap = document.getElementById('local-pin-wrap');
      pinWrap.classList.toggle('hidden', !localMode);
      document.getElementById('local-pin').value = '';
      document.getElementById('username').focus();
    }

    function showUnlock(user) {
      hideAllCards();
      unlockUser = user;
      document.getElementById('unlock-card').classList.remove('hidden');
      document.getElementById('unlock-user-label').textContent = 'Local account is locked';
      document.getElementById('unlock-error').classList.add('hidden');
      document.getElementById('unlock-pin').value = '';
      document.getElementById('unlock-pin').focus();
    }

    function enterLocalMode() {
      const users = parseJson('ot_local_users', []);
      let user = users.find(u => u.id === 1);
      if (!user) {
        user = { id: 1, username: 'local', is_admin: true, created_at: new Date().toISOString() };
        users.push(user);
        localStorage.setItem('ot_local_users', JSON.stringify(users));
      }
      localStorage.setItem('ot_local_current_user', '1');
      if (user.pin) {
        showUnlock(user);
      } else {
        localStorage.setItem('ot_token', 'local:1');
        globalThis.location.href = PATH_APP;
      }
    }

    async function migrateLocalDataToServer(baseUrl, token, username) {
      const authHeaders = {
        Authorization: `Bearer ${token}`,
        'Content-Type': 'application/json',
      };
      const request = async (method, path, body) => {
        const res = await fetch(`${baseUrl}${path}`, {
          method,
          headers: authHeaders,
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
          const detail = await res.text().catch(() => '');
          throw new Error(`${method} ${path} failed (${res.status}) ${detail}`.trim());
        }
        if (res.status === 204) return null;
        return res.json();
      };

      const marker = `${baseUrl}|${username}`;

      if (localStorage.getItem('ot_local_migrated_marker') !== marker) {
        const users = parseJson('ot_local_users', []);
        const localUser = users[0];
        if (localUser) {
          const localLists = parseJson('ot_local_lists', []).filter(l => l.owner_id === localUser.id);
          const localTasks = parseJson('ot_local_tasks', []);
          for (const list of localLists) {
            const created = await request('POST', '/lists', {
              title: list.title,
              description: list.description ?? null,
            });
            const listTasks = localTasks.filter(t => t.list_id === list.id);
            for (const task of listTasks) {
              await request('POST', `/lists/${created.id}/tasks`, {
                title: task.title,
                description: task.description ?? null,
                completed: !!task.completed,
                finance_type: task.finance_type ?? null,
                finance_amount: task.finance_amount ?? null,
              });
            }
          }
          localStorage.setItem('ot_local_migrated_marker', marker);
        }
      }

    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    // If OPENTASK_SERVER env var was injected via ?server= param, save it now
    (function () {
      const p = new URLSearchParams(window.location.search).get('server');
      if (p) localStorage.setItem('ot_server', p.replace(/\/$/, ''));
    })();

    const currentToken = localStorage.getItem('ot_token');
    if (currentToken) {
      if (currentToken.startsWith('local:')) {
        const localUserId = Number.parseInt(currentToken.slice(6), 10);
        const users = parseJson('ot_local_users', []);
        const user = users.find(u => u.id === localUserId);
        if (!user) {
          localStorage.removeItem('ot_token');
          localStorage.removeItem('ot_local_current_user');
          showLogin();
        } else if (user.pin) {
          showUnlock(user);
        } else {
          globalThis.location.href = PATH_APP;
        }
      } else {
        globalThis.location.href = PATH_APP;
      }
    } else if (authMode() === 'local') {
      enterLocalMode();
    } else if (!serverUrl()) {
      showSetup();
    } else {
      showLogin();
    }

    // ── Setup form ────────────────────────────────────────────────────────────
    document.getElementById('setup-btn').addEventListener('click', async () => {
      const errEl = document.getElementById('setup-error');
      const btn   = document.getElementById('setup-btn');
      errEl.classList.add('hidden');

      let url = document.getElementById('server-url').value.trim().replace(/\/$/, '');
      if (!url) { errEl.textContent = 'Please enter a server URL.'; errEl.classList.remove('hidden'); return; }
      if (!/^https?:\/\//i.test(url)) url = 'http://' + url;

      btn.disabled = true;
      btn.textContent = 'Connecting…';
      try {
        const res = await fetch(`${url}/`, { signal: AbortSignal.timeout(6000) });
        if (!res.ok) throw new Error(`Server responded with HTTP ${res.status}`);
        localStorage.setItem('ot_server', url);
        setAuthMode('remote');
        showLogin();
      } catch (err) {
        errEl.textContent = err.message.includes('fetch') ? 'Cannot reach server.' : err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Connect';
      }
    });
    document.getElementById('server-url').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('setup-btn').click();
    });

    // ── Change server ─────────────────────────────────────────────────────────
    document.getElementById('change-server-btn').addEventListener('click', () => {
      setAuthMode('remote');
      showSetup(serverUrl());
    });

    document.getElementById('local-account-btn').addEventListener('click', () => {
      setAuthMode('local');
      enterLocalMode();
    });

    if (!IS_LOCAL_CLIENT) {
      document.getElementById('local-account-btn').style.display = 'none';
    }

    document.getElementById('unlock-btn').addEventListener('click', () => {
      const errEl = document.getElementById('unlock-error');
      errEl.classList.add('hidden');
      const pin = document.getElementById('unlock-pin').value.trim();
      if (!unlockUser || pin !== unlockUser.pin) {
        errEl.textContent = 'Incorrect PIN.';
        errEl.classList.remove('hidden');
        return;
      }
      localStorage.setItem('ot_token', `local:${unlockUser.id}`);
      localStorage.setItem('ot_local_current_user', String(unlockUser.id));
      globalThis.location.href = PATH_APP;
    });

    document.getElementById('unlock-pin').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('unlock-btn').click();
    });

    document.getElementById('unlock-switch-btn').addEventListener('click', () => {
      localStorage.removeItem('ot_token');
      localStorage.removeItem('ot_local_current_user');
      setAuthMode('remote');
      if (serverUrl()) showLogin();
      else showSetup();
    });

    // ── Change-server visibility ──────────────────────────────────────────────
    if (!SHOW_CHANGE_SERVER) {
      document.getElementById('change-server-btn').style.display = 'none';
    }

    // ── Switch to Leaf Viper ─────────────────────────────────────────────────
    (function () {
      const switchBtn = document.getElementById('btn-switch-app');
      const budgetUrl = serverUrl() ? serverUrl().replace(/\/$/, '') + '/leaf-viper/' : '/leaf-viper/';
      const leafViperPackage = 'com.leafviper.app';
      switchBtn.href = budgetUrl;
      switchBtn.addEventListener('click', async function (event) {
        const launcher = globalThis.Capacitor?.Plugins?.AppLauncher;
        if (_CAP && launcher && typeof launcher.canOpenUrl === 'function' && typeof launcher.openUrl === 'function') {
          event.preventDefault();
          try {
            const canOpen = await launcher.canOpenUrl({ url: leafViperPackage });
            if (canOpen?.value) {
              await launcher.openUrl({ url: leafViperPackage });
              return;
            }
          } catch {}
        }

        const desktopApi = globalThis.pywebview?.api;
        if (!desktopApi || typeof desktopApi.switch_app !== 'function') return;
        event.preventDefault();
        try {
          const opened = await desktopApi.switch_app('leaf-viper');
          if (!opened) globalThis.location.href = budgetUrl;
        } catch {
          globalThis.location.href = budgetUrl;
        }
      });
    })();

    // ── Theme toggle ───────────────────────────────────────────────────────────────
    (function() {
      const btn = document.getElementById('btn-theme');
      function updateBtn() {
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      }
      btn.addEventListener('click', () => {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const next = isDark ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('ot_theme', next);
        updateBtn();
      });
      updateBtn();
    })();

    // ── Login form ────────────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      const btn   = document.getElementById('login-btn');
      errEl.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Signing in…';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const pin = document.getElementById('local-pin').value.trim();
      const localMode = authMode() === 'local';

      if (!username || !password) {
        errEl.textContent = 'Please enter username and password.';
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      try {
        if (localMode) {
          const users = JSON.parse(localStorage.getItem('ot_local_users') || '[]');
          let user = users.find(u => u.username === username);
          if (!user) {
            const nextId = users.reduce((m, u) => Math.max(m, Number(u.id) || 0), 0) + 1;
            user = {
              id: nextId,
              username,
              password,
              is_admin: false,
              created_at: new Date().toISOString(),
            };
            users.push(user);
            localStorage.setItem('ot_local_users', JSON.stringify(users));
          } else if (user.password !== password) {
            throw new Error('Incorrect username or password');
          }
          if (user.pin && user.pin !== pin) {
            throw new Error('Incorrect PIN');
          }
          localStorage.setItem('ot_local_current_user', String(user.id));
          localStorage.setItem('ot_token', `local:${user.id}`);
          globalThis.location.href = PATH_APP;
          return;
        }

        const body = new URLSearchParams({ username, password });
        const res  = await fetch(`${serverUrl()}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body,
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || `HTTP ${res.status}`);
        }
        const { access_token } = await res.json();
        await migrateLocalDataToServer(serverUrl(), access_token, username);
        localStorage.setItem('ot_server', serverUrl());
        localStorage.setItem('ob_server', serverUrl());
        localStorage.setItem('ot_auth_mode', 'remote');
        localStorage.setItem('ob_auth_mode', 'remote');
        localStorage.setItem('ot_token', access_token);
        globalThis.location.href = PATH_APP;
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
